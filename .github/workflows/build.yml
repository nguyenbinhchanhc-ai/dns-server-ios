name: Build iOS DNSGuard IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Build Xcode Project without code signing
        run: |
          xcodebuild build \
            -project DNSGuard.xcodeproj \
            -scheme DNSGuard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DNSGuard.app Payload/
          zip -r DNSGuard_compiled.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSGuard-Compiled-IPA
          path: DNSGuard_compiled.ipa
